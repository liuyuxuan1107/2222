<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>星际扫雷</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Orbitron', sans-serif;
            color: #e94560;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            width: 500px;
            margin: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 2px solid #00fff5;
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
        }

        #minefield {
            display: grid;
            grid-template-columns: repeat(10, 50px);
            gap: 5px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid #00fff5;
            box-shadow: 0 0 30px rgba(0, 255, 245, 0.2);
        }

        .cell {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #00fff5;
            color: #00fff5;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00fff5;
            background: rgba(0, 255, 245, 0.1);
        }

        .revealed {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #e94560;
            color: #e94560;
        }

        .mine {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        .mine::after {
            content: "💣";
            font-size: 1.5em;
            filter: drop-shadow(0 0 5px #e94560);
        }

        .flagged::after {
            content: "🚀";
            font-size: 1.2em;
            animation: float 2s ease-in-out infinite;
        }

        .question::after {
            content: "👾";
            font-size: 1.2em;
            opacity: 0.7;
        }

        button {
            margin-top: 30px;
            padding: 12px 25px;
            background: linear-gradient(45deg, #00fff5, #e94560);
            border: none;
            border-radius: 25px;
            color: #16213e;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .neon-text {
            text-shadow: 0 0 10px #00fff5, 0 0 20px #00fff5;
        }

        .number {
            text-shadow: 0 0 8px currentColor;
        }

        /* 新增统计面板样式 */
        .stats-container {
            position: fixed;
            right: 30px;
            top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px solid #00fff5;
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
        }

        .stats-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #00fff5;
        }

        .stats-item {
            margin: 10px 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1 class="neon-text">✨星际扫雷✨</h1>
    <div id="game-info">
        <div class="neon-text">剩余星雷: <span id="mine-count">10</span></div>
        <div class="neon-text">时空计量: <span id="timer">0</span></div>
    </div>
    <div id="minefield"></div>
    <button onclick="initGame()">超新星重启</button>

    <!-- 新增统计面板 -->
    <div class="stats-container neon-text">
        <div class="stats-title">🚀 太空战绩</div>
        <div class="stats-item">胜利次数: <span id="win-count">0</span></div>
        <div class="stats-item">失败次数: <span id="lose-count">0</span></div>
        <div class="stats-item">上次用时: <span id="last-time">0</span>秒</div>
    </div>

    <script>
        const ROWS = 10;
        const COLS = 10;
        const MINES = 10;
        let board = [];
        let gameOver = false;
        let timer = 0;
        let timerInterval;
        
        // 新增统计变量
        let winCount = 0;
        let loseCount = 0;
        let lastTime = 0;

        function initGame() {
            gameOver = false;
            timer = 0;
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = timer;
            document.getElementById('mine-count').textContent = MINES;
            createBoard();
            startTimer();
        }

        function createBoard() {
            const minefield = document.getElementById('minefield');
            minefield.innerHTML = '';
            board = Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
                isMine: false,
                revealed: false,
                flagged: false,
                question: false,
                neighborMines: 0
            })));

            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                const row = Math.floor(Math.random() * ROWS);
                const col = Math.floor(Math.random() * COLS);
                if (!board[row][col].isMine) {
                    board[row][col].isMine = true;
                    minesPlaced++;
                }
            }

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (!board[row][col].isMine) {
                        board[row][col].neighborMines = countNeighborMines(row, col);
                    }
                }
            }

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', handleLeftClick);
                    cell.addEventListener('contextmenu', handleRightClick);
                    minefield.appendChild(cell);
                }
            }
        }

        function countNeighborMines(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const newRow = row + i;
                    const newCol = col + j;
                    if (newRow >= 0 && newRow < ROWS && newCol >= 0 && newCol < COLS) {
                        if (board[newRow][newCol].isMine) count++;
                    }
                }
            }
            return count;
        }

        function handleLeftClick(e) {
            if (gameOver) return;
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const cell = board[row][col];

            if (cell.flagged || cell.revealed) return;

            if (cell.isMine) {
                endGame(false);
                revealAllMines();
                alert('星舰坠毁！游戏结束！');
                return;
            }

            revealCell(row, col);
            checkWin();
        }

        function handleRightClick(e) {
            e.preventDefault();
            if (gameOver) return;
            const cell = e.target;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            const boardCell = board[row][col];

            if (boardCell.revealed) return;

            if (!boardCell.flagged && !boardCell.question) {
                boardCell.flagged = true;
                cell.classList.add('flagged');
                updateMineCount(-1);
            } else if (boardCell.flagged) {
                boardCell.flagged = false;
                boardCell.question = true;
                cell.classList.remove('flagged');
                cell.classList.add('question');
                updateMineCount(1);
            } else {
                boardCell.question = false;
                cell.classList.remove('question');
            }
        }

        function revealCell(row, col) {
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const boardCell = board[row][col];

            if (boardCell.revealed || boardCell.flagged) return;

            boardCell.revealed = true;
            cell.classList.add('revealed');

            if (boardCell.neighborMines > 0) {
                cell.innerHTML = `<span class="number" style="color: ${getNumberColor(boardCell.neighborMines)}">${boardCell.neighborMines}</span>`;
            } else {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const newRow = row + i;
                        const newCol = col + j;
                        if (newRow >= 0 && newRow < ROWS && newCol >= 0 && newCol < COLS) {
                            if (!board[newRow][newCol].revealed) {
                                revealCell(newRow, newCol);
                            }
                        }
                    }
                }
            }
        }

        function getNumberColor(num) {
            const colors = [
                '#00fff5', '#7bff00', '#ffd700',
                '#ff6b6b', '#a855f7', '#ff00ff',
                '#00ff00', '#ffa500'
            ];
            return colors[num - 1] || '#ffffff';
        }

        function revealAllMines() {
            board.forEach((row, i) => {
                row.forEach((cell, j) => {
                    if (cell.isMine) {
                        const mineCell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                        mineCell.classList.add('mine', 'revealed');
                    }
                });
            });
        }

        function checkWin() {
            let unrevealedSafeCells = 0;
            board.forEach(row => {
                row.forEach(cell => {
                    if (!cell.isMine && !cell.revealed) unrevealedSafeCells++;
                });
            });
            if (unrevealedSafeCells === 0) {
                endGame(true);
                alert('🎉 成功穿越小行星带！');
            }
        }

        // 修改后的结束游戏函数
        function endGame(isWin) {
            gameOver = true;
            clearInterval(timerInterval);
            lastTime = timer;
            document.getElementById('last-time').textContent = lastTime;
            
            if(isWin) {
                winCount++;
                document.getElementById('win-count').textContent = winCount;
            } else {
                loseCount++;
                document.getElementById('lose-count').textContent = loseCount;
            }
        }

        function updateMineCount(change) {
            const mineCount = document.getElementById('mine-count');
            mineCount.textContent = parseInt(mineCount.textContent) + change;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = timer;
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
